aid: icon
name: ICON
description: >-
  ICON Technology, Inc. is an Austin, Texas construction-technology company building
  large-scale robotic 3D printing systems, materials, and software to make home
  building faster, more affordable, and more resilient. Its flagship Titan 3D
  construction printer, orchestrated by the proprietary BuildOS software that
  translates architectural designs into robotic tool paths and manages material
  flow, can print the wall system of a 2,500 sq. ft. home in under seven days. ICON
  operates a Design + Build division delivering 3D-printed homes and communities, a
  Technology division selling its printers and building systems to other builders,
  the CODEX digital home design catalog, and ICON Prime. The company is privately
  held and backed by investors including Bond Capital and Pantera Capital. This
  profile was added to the API Evangelist network from a venture-portfolio lead;
  ICON publishes a marketing and product presence but no public developer API,
  documentation, or SDK surface at this time.
